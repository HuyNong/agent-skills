name: Validate skills

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install reference validator
        run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate skill metadata
        run: |
          for skill in skills/*; do
            skills-ref validate "$skill"
          done
      - name: Check native Bash and shell syntax
        run: |
          /bin/bash --version
          if [[ "$RUNNER_OS" == macOS ]]; then
            /bin/bash -c '[[ "$BASH_VERSION" == 3.2.* ]]'
          fi
          for script in skills/*/scripts/*.sh; do
            /bin/bash -n "$script"
          done
      - name: Run script contract regressions
        run: python3 tests/test-pr-skill-scripts.py
      - name: Exercise independent and detached installs
        run: /bin/bash tests/test-skill-installation.sh
